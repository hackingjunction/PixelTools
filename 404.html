<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found — PixelTools</title>

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="assets/favicon.webp">
    <link rel="apple-touch-icon" href="assets/favicon.webp">

    <meta
        name="description"
        content="The page you're looking for could not be found on PixelTools."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(124,92,255,.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(0,220,255,.14),
                    transparent 35%
                ),
                #111525;
            overflow: hidden;
        }

        .orb {
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .35;
            pointer-events: none;
            animation: float 7s ease-in-out infinite;
        }

        .orb.one {
            background: #7c5cff;
            top: -100px;
            left: -80px;
        }

        .orb.two {
            background: #00dcff;
            bottom: -120px;
            right: -80px;
            animation-delay: -3s;
        }

        .card {
            width: min(560px, 100%);
            padding: 52px 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 28px;
            background: rgba(255,255,255,.055);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 25px 80px rgba(0,0,0,.35),
                inset 0 1px 0 rgba(255,255,255,.08);
            animation: appear .7s ease;
        }

        .logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 24px;
            border-radius: 22px;
            object-fit: cover;
            box-shadow: 0 0 35px rgba(124,92,255,.35);
        }

        .error {
            font-size: clamp(70px, 18vw, 130px);
            line-height: .9;
            font-weight: 900;
            letter-spacing: -6px;
            background: linear-gradient(
                90deg,
                #67e8f9,
                #a78bfa,
                #f472b6,
                #fb923c
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 {
            margin-top: 22px;
            font-size: clamp(25px, 5vw, 36px);
        }

        p {
            max-width: 420px;
            margin: 14px auto 28px;
            color: rgba(255,255,255,.68);
            line-height: 1.7;
            font-size: 15px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        a {
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 13px;
            font-weight: 700;
            transition: .25s ease;
        }

        .home {
            color: #fff;
            background: linear-gradient(
                135deg,
                #7c5cff,
                #00bfff
            );
            box-shadow: 0 8px 25px rgba(100,100,255,.25);
        }

        .back {
            color: rgba(255,255,255,.85);
            border: 1px solid rgba(255,255,255,.14);
            background: rgba(255,255,255,.05);
        }

        a:hover {
            transform: translateY(-3px);
        }

        .brand {
            margin-top: 30px;
            font-size: 13px;
            color: rgba(255,255,255,.4);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(25px, -20px);
            }
        }

        @media (max-width: 500px) {
            .card {
                padding: 40px 20px;
                border-radius: 22px;
            }

            .logo {
                width: 70px;
                height: 70px;
            }

            .error {
                letter-spacing: -4px;
            }
        }
    </style>
</head>

<body>

    <div class="orb one"></div>
    <div class="orb two"></div>

    <main class="card">

        <img
            src="assets/favicon.webp"
            alt="PixelTools"
            class="logo"
            width="82"
            height="82"
        >

        <div class="error">404</div>

        <h1>Oops! Page Not Found</h1>

        <p>
            The page you're looking for doesn't exist, may have been moved,
            or the link might be incorrect.
        </p>

        <div class="buttons">

            <a href="index.html" class="home">
                ← Back to PixelTools
            </a>

            <a href="javascript:history.back()" class="back">
                Go Back
            </a>

        </div>

        <div class="brand">
            PixelTools · Free Online Tools
        </div>

    </main>

</body>
</html>
